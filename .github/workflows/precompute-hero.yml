# Caches every hero topic and its first-level threads each morning, shortly
# after the 07:00 UTC hero switch, so visitors get them instantly. See
# scripts/precompute-hero.mjs. Needs the PRECOMPUTE_SECRET repository
# secret (the same value as the rabbit-hole-proxy-v2 function secret).
#
# Started at 07:03 by Supabase (pg_cron, migration 0057), since GitHub's
# own schedule can run hours late. The schedule below is only a backup in
# case that didn't happen; after a run that did, it's all cache hits.
name: Precompute hero pages

on:
  schedule:
    - cron: "40 8 * * *"
  workflow_dispatch:

# A backup or manual run waits for one already going rather than overlapping it.
concurrency:
  group: precompute-hero
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/precompute-hero.mjs
        env:
          PRECOMPUTE_SECRET: ${{ secrets.PRECOMPUTE_SECRET }}
